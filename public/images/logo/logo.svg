<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 76" fill="none">
  <defs>
    <linearGradient id="dhaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C158"/>
      <stop offset="50%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#8F6B0E"/>
    </linearGradient>
    <linearGradient id="shieldNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142247"/>
      <stop offset="100%" stop-color="#080E21"/>
    </linearGradient>
    <filter id="goldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#C59B27" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Luxury DHA Crest / Emblem -->
  <g transform="translate(8, 6)">
    <!-- Outer Shield -->
    <path d="M30 2 C46 2 58 12 58 28 C58 48 30 62 30 62 C30 62 2 48 2 28 C2 12 14 2 30 2 Z" fill="url(#shieldNavy)" stroke="url(#dhaGold)" stroke-width="2.2" filter="url(#goldShadow)"/>
    <!-- Inner Arch -->
    <path d="M18 46 L18 25 C18 17 42 17 42 25 L42 46" stroke="url(#dhaGold)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <!-- Central Roman Numeral VI -->
    <path d="M25 25 L30 36 L35 25" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="39" y1="25" x2="39" y2="36" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <!-- Crown / Top Star -->
    <path d="M30 9 L34 17 L30 20 L26 17 Z" fill="url(#dhaGold)"/>
    <circle cx="30" cy="46" r="2.5" fill="url(#dhaGold)"/>
  </g>

  <!-- Typography -->
  <text x="80" y="21" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#64748B" letter-spacing="3.2">DEFENCE HOUSING AUTHORITY</text>
  <text x="79" y="45" font-family="'Plus Jakarta Sans', 'Playfair Display', system-ui, sans-serif" font-size="23" font-weight="900" fill="#0A1128" letter-spacing="1">DHA PHASE 6</text>
  <text x="80" y="62" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="url(#dhaGold)" letter-spacing="3.5">LAHORE • REAL ESTATE</text>
  <line x1="80" y1="50" x2="360" y2="50" stroke="#E2E8F0" stroke-width="1"/>
</svg>
