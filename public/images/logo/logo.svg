<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 76" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C158"/>
      <stop offset="50%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#8F6B0E"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142147"/>
      <stop offset="100%" stop-color="#0A1128"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#C59B27" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Logo Mark / Emblem -->
  <g transform="translate(6, 6)">
    <!-- Outer Shield / Archway -->
    <path d="M32 2 C48 2 60 12 60 28 C60 48 32 62 32 62 C32 62 4 48 4 28 C4 12 16 2 32 2 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#goldGlow)"/>
    <!-- Inner Architectural Gate / Monogram -->
    <path d="M22 46 L22 26 C22 18 42 18 42 26 L42 46" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Central Tower Pinnacle / Diamond -->
    <path d="M32 10 L38 20 L32 24 L26 20 Z" fill="url(#goldGrad)"/>
    <!-- Crescent / Garden Leaf Accent -->
    <path d="M16 34 C24 38 40 38 48 34" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <circle cx="32" cy="36" r="3" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography -->
  <!-- Top Category / Tag -->
  <text x="78" y="21" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#64748B" letter-spacing="2.8">AUTHORITY REAL ESTATE</text>
  
  <!-- Primary Brand Name (Complete & Uncut) -->
  <text x="77" y="44" font-family="'Playfair Display', Georgia, serif" font-size="21.5" font-weight="800" fill="#0A1128" letter-spacing="0.5">AL REHMAN GARDEN</text>
  
  <!-- Phase 2 / Location Tag -->
  <text x="78" y="62" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="url(#goldGrad)" letter-spacing="3.2">PHASE 2 • LAHORE</text>

  <!-- Divider Accent Line -->
  <line x1="78" y1="49" x2="355" y2="49" stroke="#E2E8F0" stroke-width="1"/>
</svg>
