<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09091b" />
      <stop offset="50%" stop-color="#14142f" />
      <stop offset="100%" stop-color="#09091b" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" />
  <rect width="800" height="500" fill="url(#grid)" />
  <circle cx="400" cy="210" r="280" fill="url(#glow)" />

  <!-- Outer Architectural Ring -->
  <circle cx="400" cy="200" r="95" fill="none" stroke="rgba(212,168,68,0.15)" stroke-width="2" stroke-dasharray="6 6" />
  <circle cx="400" cy="200" r="78" fill="rgba(17,17,37,0.85)" stroke="url(#gold)" stroke-width="2" />

  <!-- Center Icon -->
  <g transform="translate(364, 164)">
    <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8h1a4 4 0 0 1 0 8h-1"/>
      <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/>
      <line x1="6" y1="1" x2="6" y2="4"/>
      <line x1="10" y1="1" x2="10" y2="4"/>
      <line x1="14" y1="1" x2="14" y2="4"/>
    </svg>
  </g>

  <!-- Content Pill -->
  <g transform="translate(250, 315)">
    <rect width="300" height="26" rx="13" fill="rgba(212,168,68,0.1)" stroke="rgba(212,168,68,0.25)" stroke-width="1" />
    <text x="150" y="17" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">DHA PHASE 6 LAHORE</text>
  </g>

  <!-- Main Title -->
  <text x="400" y="380" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5" text-anchor="middle">Dining, Cafes &amp; Restaurants</text>

  <!-- Subtitle -->
  <text x="400" y="412" fill="#9292ad" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" letter-spacing="0.5" text-anchor="middle">Fine Dining, Fast Food, Artisan Coffee &amp; Bakeries</text>

  <!-- Bottom Accent Line -->
  <rect x="360" y="440" width="80" height="3" rx="1.5" fill="url(#gold)" />
</svg>